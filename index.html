<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>マトリックスの緑の画面でクイズ</title>
    <meta name="description" content="マトリックスの緑の画面に降ってくるカタカナを読み取るタイピングクイズ。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://isikoro1.github.io/matrix-rain-quiz/">
    <meta property="og:title" content="マトリックスの緑の画面でクイズ">
    <meta property="og:description" content="Digital Rain Quiz。降ってくるカタカナを読み取るタイピングクイズ。">
    <meta property="og:image" content="https://isikoro1.github.io/matrix-rain-quiz/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="マトリックスの緑の画面でクイズ">
    <meta name="twitter:description" content="Digital Rain Quiz。降ってくるカタカナを読み取るタイピングクイズ。">
    <meta name="twitter:image" content="https://isikoro1.github.io/matrix-rain-quiz/og-image.png">
    <link rel="stylesheet" href="styles.css?v=10">
  </head>
  <body>
    <canvas id="rainCanvas" aria-hidden="true"></canvas>

    <main class="app">
      <section id="titleScreen" class="screen title-screen is-active" aria-label="Title">
        <div class="title-copy">
          <p class="eyebrow">Digital Rain Quiz</p>
          <h1>マトリックスの緑の画面でクイズ</h1>
        </div>
        <p class="title-tagline">カタカナを読み取り隠された単語を当てろ</p>
        <button id="startButton" class="primary-action" type="button">Start</button>
      </section>

      <section id="countdownScreen" class="screen countdown-screen" aria-label="Countdown">
        <p class="eyebrow">Prepare</p>
        <div id="countdownNumber" class="countdown-number">3</div>
      </section>

      <section id="gameScreen" class="screen game-screen" aria-label="Game">
        <div class="game-panel">
          <div class="game-hud">
            <div class="meter side-meter">
              <span>Question</span>
              <strong id="questionCount">0 / 10</strong>
            </div>
            <div class="meter time-meter">
              <span>Time</span>
              <strong id="timeLeft" class="time-value">60</strong>
              <span class="time-flashes" aria-hidden="true">
                <span id="timeTensFlash" class="time-flash"></span>
                <span id="timeOnesFlash" class="time-flash"></span>
              </span>
            </div>
            <div class="meter side-meter">
              <span>Level</span>
              <strong id="difficultyLabel">Ready</strong>
            </div>
          </div>

          <form id="answerForm" class="answer-row">
            <label for="answerInput">Answer</label>
            <div id="answerSlots" class="answer-slots" role="textbox" aria-label="Answer input" tabindex="0"></div>
            <input id="answerInput" class="answer-input" autocomplete="off" spellcheck="false">
          </form>

          <p id="message" class="message" role="status"></p>
          <p class="score-line">Score <strong id="score">0</strong></p>
          <button id="answerButton" class="answer-submit" form="answerForm" type="submit" aria-label="Answer">&#9166;</button>
        </div>
      </section>

      <section id="resultScreen" class="screen result-screen" aria-label="Result">
        <div class="result-summary">
          <p class="eyebrow">Result</p>
          <h2>Score <span id="finalScore">0</span></h2>
          <p id="finalCleared">0 / 10 cleared</p>
          <p id="finalFeedback" class="final-feedback"></p>
        </div>

        <section class="ranking" aria-label="Local ranking">
          <h3>Local Ranking</h3>
          <ol id="rankingList">
            <li>No results yet</li>
          </ol>
        </section>

        <div class="result-actions">
          <button id="shareButton" type="button">Share on X</button>
          <button id="retryButton" type="button">Again</button>
          <button id="titleButton" type="button">Title</button>
        </div>
      </section>
    </main>

    <script src="src/utils.js?v=10"></script>
    <script src="src/scoring.js?v=10"></script>
    <script src="src/quiz-generator.js?v=10"></script>
    <script src="src/game-state.js?v=10"></script>
    <script src="src/rain-engine.js?v=10"></script>
    <script src="src/renderer.js?v=10"></script>
    <script src="src/share.js?v=10"></script>
    <script src="src/storage.js?v=10"></script>
    <script src="src/main.js?v=10"></script>
  </body>
</html>
